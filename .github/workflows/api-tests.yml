name: API tests
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: api-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      # Several modules build a Prisma client on import and need a parseable URL.
      # No database connection is made by unit tests.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate API Prisma client
        working-directory: apps/api
        run: bun run db:generate
      - name: Run API unit tests
        working-directory: apps/api
        run: npx jest --ci
