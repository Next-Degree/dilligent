name: Deploy API to Trigger.dev (prod)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x" # Match staging and Vercel

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install --frozen-lockfile --ignore-scripts
      - name: Install DB package dependencies
        working-directory: ./packages/db
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Integration Platform package dependencies
        working-directory: ./packages/integration-platform
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Integration Platform package
        working-directory: ./packages/integration-platform
        run: bun run build

      - name: Build Email package
        working-directory: ./packages/email
        run: bun run build

      - name: Build DB package
        working-directory: ./packages/db
        run: bun run build

      - name: Build Utils package
        working-directory: ./packages/utils
        run: bun run build

      # API trigger tasks import these workspace packages, which resolve to dist/.
      - name: Build Auth package
        working-directory: ./packages/auth
        run: bun run build

      - name: Build Company package
        working-directory: ./packages/company
        run: bun run build

      - name: Copy model files to api schema dir
        working-directory: ./apps/api
        run: |
          find ../../packages/db/prisma/schema -name '*.prisma' ! -name 'schema.prisma' -exec cp {} prisma/schema/ \;

      - name: 🚀 Deploy Trigger.dev
        timeout-minutes: 20
        working-directory: ./apps/api
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN_API }}
        run: bunx trigger.dev@4.8.3 deploy
