name: Database Migrations Main
on:
  push: # Runs AFTER merge to main (never during PR review!)
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read # only needs to check out the repo to run migrations

jobs:
  migrate:
    name: Run Database Migrations
    # Never apply another branch's migrations to the production database
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install DB dependencies
        working-directory: packages/db
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        working-directory: packages/db
        run: bunx prisma migrate deploy
