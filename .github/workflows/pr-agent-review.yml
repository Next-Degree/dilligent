name: PR-Agent Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent-review:
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.title, '[WIP]') &&
      !startsWith(github.event.pull_request.title, 'chore(')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Run PR-Agent Review
        id: pr-agent-review
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI.KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENAI.API_BASE: https://ai-gateway.vercel.sh/v1
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "synchronize"]'
