name: Device Agent Release

# This pipeline handles Apple code-signing secrets (MAC_CSC_LINK, APPLE_ID, ...) and
# SSL.com eSigner secrets (ESIGNER_*). The signing build jobs and the upload job run in
# the device-agent-production / device-agent-staging GitHub environments. The secrets are
# only protected once they are stored in those environments (not at repo level) and the
# environments' deployment-branch rules allow only main and dev respectively. Missing
# signing secrets produce unsigned builds on dev and fail the build on main.
# The push trigger below is limited to those branches so feature branches don't start
# releases; on its own it does not protect the secrets, since workflow_dispatch or an
# edited workflow on any branch could still run. Manual staging builds remain available
# via workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'dev']
    paths:
      - 'packages/device-agent/**'
      # Changes to this workflow are otherwise never exercised by CI.
      - '.github/workflows/device-agent-*.yml'
      - '.github/scripts/upload-device-agent.sh'

permissions:
  contents: read

jobs:
  detect-version:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      portal_url: ${{ steps.version.outputs.portal_url }}
      api_url: ${{ steps.version.outputs.api_url }}
      release_name: ${{ steps.version.outputs.release_name }}
      auto_update_url: ${{ steps.version.outputs.auto_update_url }}
      release_channel: ${{ steps.version.outputs.release_channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        run: |
          # Get the latest production tag (only match clean semver tags like device-agent-v1.0.0)
          LATEST_TAG=$(git tag -l 'device-agent-v*' --sort=-v:refname | grep -E '^device-agent-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # No existing tags - start at 1.0.0
            NEXT_VERSION="1.0.0"
          else
            # Extract version and bump patch
            CURRENT_VERSION="${LATEST_TAG#device-agent-v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          BRANCH="${GITHUB_REF_NAME}"

          # Both environments run on the Pickle-hosted Dilligent estate; the
          # main (production) branch is still distinguished by its tag and S3 prefix.
          PORTAL_URL="https://dilligent-portal.withpickle.dev"
          API_URL="https://dilligent-api.withpickle.dev"

          if [ "$BRANCH" = "main" ]; then
            TAG_NAME="device-agent-v${NEXT_VERSION}"
            IS_PRERELEASE="false"
            RELEASE_NAME="Device Agent v${NEXT_VERSION}"
            RELEASE_CHANNEL="production"
          else
            TAG_NAME="device-agent-v${NEXT_VERSION}-staging.${GITHUB_RUN_NUMBER}"
            IS_PRERELEASE="true"
            RELEASE_NAME="Device Agent v${NEXT_VERSION} (Staging #${GITHUB_RUN_NUMBER})"
            RELEASE_CHANNEL="staging"
          fi

          # Auto-update URL: proxied through the portal (no direct S3 access needed)
          AUTO_UPDATE_URL="${PORTAL_URL}/api/device-agent/updates"

          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "portal_url=$PORTAL_URL" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "auto_update_url=$AUTO_UPDATE_URL" >> $GITHUB_OUTPUT
          echo "release_channel=$RELEASE_CHANNEL" >> $GITHUB_OUTPUT

          echo "--- Version Info ---"
          echo "Latest tag: $LATEST_TAG"
          echo "Next version: $NEXT_VERSION"
          echo "Tag name: $TAG_NAME"
          echo "Pre-release: $IS_PRERELEASE"
          echo "Portal URL: $PORTAL_URL"
          echo "API URL: $API_URL"
          echo "Auto-update URL: $AUTO_UPDATE_URL"
          echo "Release channel: $RELEASE_CHANNEL"

  build-unix:
    needs: detect-version
    uses: ./.github/workflows/device-agent-build-unix.yml
    secrets: inherit
    with:
      version: ${{ needs.detect-version.outputs.version }}
      portal_url: ${{ needs.detect-version.outputs.portal_url }}
      api_url: ${{ needs.detect-version.outputs.api_url }}
      auto_update_url: ${{ needs.detect-version.outputs.auto_update_url }}
      release_channel: ${{ needs.detect-version.outputs.release_channel }}

  build-windows:
    needs: detect-version
    uses: ./.github/workflows/device-agent-build-windows.yml
    secrets: inherit
    with:
      version: ${{ needs.detect-version.outputs.version }}
      portal_url: ${{ needs.detect-version.outputs.portal_url }}
      api_url: ${{ needs.detect-version.outputs.api_url }}
      auto_update_url: ${{ needs.detect-version.outputs.auto_update_url }}
      release_channel: ${{ needs.detect-version.outputs.release_channel }}

  release:
    name: Create GitHub Release
    needs: [detect-version, upload-neon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: device-agent-macos
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: device-agent-windows
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: device-agent-linux
          path: artifacts/

      - name: Create git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.detect-version.outputs.tag_name }}" -m "${{ needs.detect-version.outputs.release_name }}"
          git push origin "${{ needs.detect-version.outputs.tag_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag_name }}
          name: ${{ needs.detect-version.outputs.release_name }}
          body: |
            ## ${{ needs.detect-version.outputs.release_name }}

            **Environment:** ${{ needs.detect-version.outputs.is_prerelease == 'true' && 'Staging' || 'Production' }}
            **Portal:** ${{ needs.detect-version.outputs.portal_url }}

            ### Downloads
            - **macOS**: Download the `.dmg` file below (universal binary, Apple Silicon + Intel)
            - **Windows**: Download the `.exe` installer below
            - **Linux**: Download the `.AppImage` (portable) or `.deb` (Debian/Ubuntu) below

            ### What's included
            - Disk encryption check (FileVault / BitLocker / LUKS)
            - Antivirus detection (XProtect / Windows Defender / ClamAV + AppArmor/SELinux)
            - Password policy enforcement (minimum 8 characters)
            - Screen lock verification (5 minutes or less)
            - Auto-remediation for fixable settings with guided instructions

            ### Installation
            1. Download the installer for your operating system
            2. Run the installer and follow the prompts
            3. Sign in with your Dilligent portal credentials
            4. The agent will run in your system tray and check compliance automatically
          draft: false
          prerelease: ${{ needs.detect-version.outputs.is_prerelease == 'true' }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-neon:
    name: Upload to Neon Object Storage
    needs: [detect-version, build-unix, build-windows]
    runs-on: ubuntu-latest
    # Select a complete configuration per environment; never fall back to production secrets.
    environment: device-agent-${{ needs.detect-version.outputs.release_channel }}
    concurrency:
      group: device-agent-storage-${{ needs.detect-version.outputs.release_channel }}
      cancel-in-progress: false
    env:
      FLEET_DEVICE_S3_ACCESS_KEY_ID: ${{ secrets.FLEET_DEVICE_S3_ACCESS_KEY_ID }}
      FLEET_DEVICE_S3_SECRET_ACCESS_KEY: ${{ secrets.FLEET_DEVICE_S3_SECRET_ACCESS_KEY }}
      FLEET_DEVICE_S3_REGION: ${{ vars.FLEET_DEVICE_S3_REGION }}
      FLEET_DEVICE_S3_ENDPOINT_URL: ${{ vars.FLEET_DEVICE_S3_ENDPOINT_URL }}
      FLEET_DEVICE_S3_BUCKET: ${{ vars.FLEET_DEVICE_S3_BUCKET }}
      VERSION: ${{ needs.detect-version.outputs.version }}
      FLEET_DEVICE_S3_ENV: ${{ vars.FLEET_DEVICE_S3_ENV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download device-agent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: device-agent-*
          path: artifacts/
          merge-multiple: true

      - name: Publish installers and auto-update files
        run: bash .github/scripts/upload-device-agent.sh
