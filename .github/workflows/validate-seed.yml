name: Validate framework seed catalog
on:
  pull_request:
    paths:
      - 'packages/db/prisma/seed/**'
permissions:
  contents: read
jobs:
  validate-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      # The validator is dependency-free (node builtins only), so no install step.
      - name: Validate catalog
        run: bun prisma/seed/validation/validate.ts
        working-directory: packages/db
