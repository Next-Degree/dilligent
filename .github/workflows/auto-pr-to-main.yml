name: Create Dev -> Main Pull Request
on:
  push:
    branches:
      - dev
jobs:
  create-pull-request:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      pull-requests: write
      contents: write
      issues: write
    steps:
      - name: Add permissions
        run: git config --global --add safe.directory /github/workspace
        continue-on-error: true
      - name: Check out repository code
        uses: actions/checkout@v3
        continue-on-error: true
      - name: Get package version
        id: package-version
        run: echo "::set-output name=PACKAGE_VERSION::$(cat package.json | jq -r .version)"
      # The pull-request action will now only run if the checkout action was successful.
      - name: Create pull request
        id: create-pr
        if: ${{ success() }} # This step runs only if all previous steps succeeded
        uses: repo-sync/pull-request@v2
        continue-on-error: true
        with:
          destination_branch: 'main'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_label: 'prod-deploy,automated-pr'
          pr_title: '[${{ github.event.repository.name }}] Production Deploy'
          pr_body: |
            This is an automated pull request to release the candidate branch into production, which will trigger a deployment.
            It was created by the [Production PR] action.
      # The step above tolerates benign errors (PR already open, nothing to promote).
      # Fail the job only when dev is ahead of main and no promotion PR exists.
      - name: Verify promotion PR exists
        if: ${{ steps.create-pr.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...dev" --jq .ahead_by)
          if [ "$AHEAD" = "0" ]; then
            echo "dev has no commits ahead of main; nothing to promote."
            exit 0
          fi
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq length)
          if [ "$OPEN" -gt 0 ]; then
            echo "A dev -> main pull request is already open."
            exit 0
          fi
          echo "::error::Failed to open the dev -> main production pull request."
          exit 1
