name: Build Device Agent Unix

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      portal_url:
        required: true
        type: string
      api_url:
        required: true
        type: string
      auto_update_url:
        required: true
        type: string
      release_channel:
        description: production or staging; selects the device-agent-<channel> environment holding the signing secrets
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (.dmg + .zip)
    runs-on: macos-latest
    # Signing secrets live in this environment; its deployment-branch rules gate who can read them.
    environment: device-agent-${{ inputs.release_channel }}
    defaults:
      run:
        working-directory: packages/device-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package.json version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = process.env.VERSION;
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
          API_URL: ${{ inputs.api_url }}
          AGENT_VERSION: ${{ inputs.version }}
        run: bun run build

      # An unset MAC_CSC_LINK still reaches electron-builder as an empty CSC_LINK,
      # which it resolves relative to the cwd and then rejects ("... not a file").
      # Decide up front whether to sign so the env var is omitted entirely when we can't.
      # Production requires signing unless the ALLOW_UNSIGNED_MAC_RELEASE repository
      # variable is 'true'. That is a stopgap until an Apple Developer ID certificate
      # exists: unsigned apps trip Gatekeeper and cannot auto-update on macOS.
      - name: Detect macOS signing credentials
        id: mac_signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          ALLOW_UNSIGNED_MAC_RELEASE: ${{ vars.ALLOW_UNSIGNED_MAC_RELEASE }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ] && [ "$ALLOW_UNSIGNED_MAC_RELEASE" = "true" ]; then
            echo "::warning::MAC_CSC_LINK is not configured and ALLOW_UNSIGNED_MAC_RELEASE is true. Publishing an UNSIGNED production macOS build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::MAC_CSC_LINK is not configured. Production macOS builds must be signed. Set the ALLOW_UNSIGNED_MAC_RELEASE repository variable to 'true' to publish unsigned anyway."
            exit 1
          else
            echo "::warning::MAC_CSC_LINK is not configured. Building macOS artifacts unsigned."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package macOS (signed)
        if: steps.mac_signing.outputs.available == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        run: bun run package:mac

      - name: Package macOS (unsigned)
        if: steps.mac_signing.outputs.available != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        run: bun run package:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-agent-macos
          path: |
            packages/device-agent/release/*.dmg
            packages/device-agent/release/*.zip
            packages/device-agent/release/*.blockmap
            packages/device-agent/release/*.yml
          if-no-files-found: error

  build-linux:
    name: Build Linux (.AppImage, .deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/device-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package.json version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = process.env.VERSION;
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
          API_URL: ${{ inputs.api_url }}
          AGENT_VERSION: ${{ inputs.version }}
        run: bun run build

      - name: Package Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        run: bun run package:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-agent-linux
          path: |
            packages/device-agent/release/*.AppImage
            packages/device-agent/release/*.deb
            packages/device-agent/release/*.blockmap
            packages/device-agent/release/*.yml
          if-no-files-found: error
