name: Build Device Agent Unix

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      portal_url:
        required: true
        type: string
      api_url:
        required: true
        type: string
      auto_update_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (.dmg + .zip)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/device-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package.json version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = process.env.VERSION;
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
          API_URL: ${{ inputs.api_url }}
          AGENT_VERSION: ${{ inputs.version }}
        run: bun run build

      # An unset MAC_CSC_LINK still reaches electron-builder as an empty CSC_LINK,
      # which it resolves relative to the cwd and then rejects ("... not a file").
      # Decide up front whether to sign so the env var is omitted entirely when we can't.
      # Production requires signing unless the ALLOW_UNSIGNED_MAC_RELEASE repository
      # variable is 'true'. That is a stopgap until an Apple Developer ID certificate
      # exists: unsigned apps trip Gatekeeper and cannot auto-update on macOS.
      - name: Detect macOS signing credentials
        id: mac_signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          ALLOW_UNSIGNED_MAC_RELEASE: ${{ vars.ALLOW_UNSIGNED_MAC_RELEASE }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ] && [ "$ALLOW_UNSIGNED_MAC_RELEASE" = "true" ]; then
            echo "::warning::MAC_CSC_LINK is not configured and ALLOW_UNSIGNED_MAC_RELEASE is true. Publishing an UNSIGNED production macOS build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::MAC_CSC_LINK is not configured. Production macOS builds must be signed. Set the ALLOW_UNSIGNED_MAC_RELEASE repository variable to 'true' to publish unsigned anyway."
            exit 1
          else
            echo "::warning::MAC_CSC_LINK is not configured. Building macOS artifacts unsigned."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # electron-builder's own CSC_LINK import builds a temp keychain and runs
      # `security set-key-partition-list` against it, which fails on current macOS
      # runners ("SecKeychainUnlock: passphrase not correct"). Import the
      # certificate ourselves instead and leave CSC_LINK unset so electron-builder
      # auto-discovers the Developer ID identity from the keychain search list.
      - name: Import macOS signing certificate
        if: steps.mac_signing.outputs.available == 'true'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/signing-cert.p12"

          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CSC_KEY_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Package macOS (signed)
        if: steps.mac_signing.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        run: bun run package:mac

      - name: Package macOS (unsigned)
        if: steps.mac_signing.outputs.available != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        run: bun run package:mac

      - name: Remove signing keychain
        if: always() && steps.mac_signing.outputs.available == 'true'
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-agent-macos
          path: |
            packages/device-agent/release/*.dmg
            packages/device-agent/release/*.zip
            packages/device-agent/release/*.blockmap
            packages/device-agent/release/*.yml
          if-no-files-found: error

  build-linux:
    name: Build Linux (.AppImage, .deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/device-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package.json version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = process.env.VERSION;
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
          API_URL: ${{ inputs.api_url }}
          AGENT_VERSION: ${{ inputs.version }}
        run: bun run build

      - name: Package Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_UPDATE_URL: ${{ inputs.auto_update_url }}
        run: bun run package:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-agent-linux
          path: |
            packages/device-agent/release/*.AppImage
            packages/device-agent/release/*.deb
            packages/device-agent/release/*.blockmap
            packages/device-agent/release/*.yml
          if-no-files-found: error
