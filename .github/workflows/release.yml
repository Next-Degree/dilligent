name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Get version before release
        id: version_before
        run: echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: bun run semantic-release

      - name: Check if release was created
        id: check_release
        run: |
          # Get the latest version after semantic-release
          VERSION_AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          echo "version_after=$VERSION_AFTER" >> $GITHUB_OUTPUT

          # Check if version changed
          if [ "${{ steps.version_before.outputs.version }}" != "$VERSION_AFTER" ] && [ ! -z "$VERSION_AFTER" ]; then
            echo "release_created=true" >> $GITHUB_OUTPUT
          else
            echo "release_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge release back to dev
        if: ${{ steps.check_release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Skip when the staging branch has not been created yet
          if ! git ls-remote --exit-code --heads origin dev > /dev/null; then
            echo "::warning::origin/dev does not exist; skipping merge back"
            exit 0
          fi

          # Fetch all branches to ensure we have latest
          git fetch origin

          # Checkout dev (staging)
          git checkout -B dev origin/dev

          # Merge main (which now has the new release commits)
          git merge --no-ff origin/main -m "chore: merge release ${{ steps.check_release.outputs.version_after }} back to dev [skip ci]"

          # Push to dev
          git push origin dev
